<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>airmiya.jp</title>
<meta name="description" content="airmiya.jp - Research and Development.">
<meta name="theme-color" content="#EAEEF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1C1B19;
    --ink-soft: #4A4843;
    --blue: #2454C7;
    --blue-soft: #4E7BE0;
    --radius: 26px;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-font-smoothing: antialiased; }

  /* すりガラスの透け感を見せるため、背景は彩度高めのカラーメッシュ */
  body{
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    background:
      radial-gradient(640px 480px at 6% -6%, rgba(36,84,199,0.55), transparent 60%),
      radial-gradient(560px 480px at 96% 6%, rgba(78,123,224,0.45), transparent 58%),
      radial-gradient(620px 520px at 30% 95%, rgba(120,70,220,0.35), transparent 60%),
      radial-gradient(560px 480px at 90% 92%, rgba(30,170,160,0.35), transparent 58%),
      linear-gradient(180deg, #EFF2F8 0%, #E4E8F3 100%);
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: clamp(32px, 8vw, 88px) 24px 64px;
  }

  /* ---------- Hero ---------- */
  .hero{
    text-align: center;
    margin-bottom: clamp(26px, 5.3vw, 48px);
  }

  .hero h1{
    display: inline-block;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 38px);
    margin: 0 0 10px;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255,255,255,0.9);
  }

  .hero p{
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.9;
  }

  .hero .en{
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: var(--blue-soft);
    letter-spacing: 0.04em;
    margin-top: 6px;
  }

  /* ---------- Grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  /* ---------- Glass card ---------- */
  .card{
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 26px;
    background: linear-gradient(135deg, rgba(255,255,255,0.40), rgba(255,255,255,0.12));
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: var(--radius);
    box-shadow:
      0 20px 45px -20px rgba(31,38,135,0.35),
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -1px 12px rgba(255,255,255,0.15);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    animation: rise 0.5s ease backwards;
    transition: border-color 0.25s ease;
  }

  /* ガラス面を斜めに走る反射光 */
  .card::before{
    content: "";
    position: absolute;
    top: -60%;
    left: -20%;
    width: 60%;
    height: 220%;
    background: linear-gradient(120deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 70%);
    transform: rotate(20deg);
    pointer-events: none;
  }

  .card > *{ position: relative; z-index: 1; }

  /* ホバーは枠の着色のみ（リンクカードだけ。プロフィールは対象外） */
  a.card:hover,
  a.card:focus-visible{
    border-color: rgba(78,123,224,0.85);
  }

  a.card:focus-visible{
    outline: 2px solid var(--blue-soft);
    outline-offset: 2px;
  }

  .icon{
    flex: none;
    width: 46px;
    height: 46px;
    padding: 10px;
    color: #fff;
    background: linear-gradient(135deg, var(--blue-soft), var(--blue));
    border-radius: 14px;
    box-shadow: 0 8px 18px -8px rgba(36,84,199,0.55);
  }
  .icon svg{ width: 100%; height: 100%; }

  .card .name{
    font-family: 'Poppins', 'Noto Sans JP', sans-serif;
    font-weight: 600;
    font-size: 17px;
  }

  .card .handle{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .card .desc{
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.7;
    margin-top: 14px;
  }

  /* ---------- Wide card（2列分） ---------- */
  .card.wide{
    grid-column: span 2;
    flex-direction: row;
    align-items: center;
    gap: 24px;
  }

  .card.wide .desc{ margin-top: 10px; }

  /* 村野製作所カードのアイコンは大きめに */
  .card.wide .icon{
    width: 72px;
    height: 72px;
    padding: 9px;
    border-radius: 21px;
  }

  /* ---------- Profile card（全幅） ---------- */
  .card.profile-card{
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    gap: 24px;
    cursor: default;
  }

  .avatar{
    flex: none;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.7);
    box-shadow: 0 8px 18px -8px rgba(36,84,199,0.55);
  }

  .avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .avatar-fallback{
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--blue-soft), var(--blue));
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 26px;
  }

  .profile-text{ text-align: left; }

  .profile-name{
    font-family: 'Poppins', 'Noto Sans JP', sans-serif;
    font-weight: 700;
    font-size: 20px;
  }

  .profile-tagline{
    font-family: 'Poppins', 'Noto Sans JP', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: var(--blue-soft);
    margin-top: 2px;
  }

  .profile-bio{
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    margin: 10px 0 0;
  }

  /* ---------- Animation ---------- */
  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .grid .card:nth-child(1){ animation-delay: 0.05s; }
  .grid .card:nth-child(2){ animation-delay: 0.12s; }
  .grid .card:nth-child(3){ animation-delay: 0.19s; }
  .grid .card:nth-child(4){ animation-delay: 0.26s; }
  .grid .card:nth-child(5){ animation-delay: 0.33s; }
  .grid .card:nth-child(6){ animation-delay: 0.40s; }

  footer{
    text-align: center;
    margin-top: 64px;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'Poppins', sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation: none; transition: none; }
  }

  /* ---------- Responsive ---------- */
  /* 2列グリッド: 村野製作所(2列分=全幅) / X + note / Apps + Apps */

  @media (max-width: 520px){
    .card.profile-card{
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .profile-text{ text-align: center; }
    .profile-bio{ text-align: left; }
  }

  @media (max-width: 420px){
    .grid{ grid-template-columns: 1fr; }
    .card.wide{
      grid-column: auto;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }
    .card.wide .desc{ margin-top: 14px; text-align: left; }
    .card.wide .icon{ align-self: center; }
    .card.wide .name,
    .card.wide .handle{ text-align: center; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <h1>airmiya.jp</h1>
    <p class="en">Research &amp; Development</p>
    <p>開発ログと制作物はこちら</p>
  </header>

  <main class="grid" id="linkGrid">
    <div class="card profile-card">
      <div class="avatar">
        <img src="https://unavatar.io/x/airmiya?fallback=false" alt="airmiya">
        <div class="avatar-fallback">A</div>
      </div>
      <div class="profile-text">
        <div class="profile-name">airmiya</div>
        <div class="profile-tagline">えあみや</div>
        <p class="profile-bio">IT系の仕事の傍ら、Web・クラウド・インフラ・AIまで幅広く触るエンジニア。最近はLLMやAIによるキャラクター表現に関心があり、技術考察や個人制作のWebアプリ開発をしています。</p>
      </div>
    </div>
  </main>

  <footer>&copy;<span id="year"></span> airmiya</footer>

</div>

<script>
  // リンクの追加・削除はこの配列を編集します。
  // wide: true を付けたカードは2列分の幅で表示されます。
  const links = [
    {
      name: "村野製作所",
      handle: "Murano Seisakusho",
      desc: "『ゼロからつくる日野下インストール』ボトムアップ型AIの未来と可能性<br>日野下花帆の人格を、AIで再現できるのか。その問いに技術の側から向き合う一冊です。<br>コミックマーケット109 1日目（12/29）西2 い31b",
      url: "https://airmiya.jp/murano/",
      sameTab: true, // 同一サイト内のページなので同じタブで開く
      wide: true,
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h6"/><path d="M10.2 2.5v5.6L3.7 18.6A2 2 0 0 0 5.4 21.6h13.2a2 2 0 0 0 1.7-3L13.8 8.1V2.5"/><path d="M7.95 11.7c1.4-1.3 2.6-1.3 4.05 0s2.6 1.3 4.05 0"/><path d="M9.1 14.9L7.3 17l1.8 2.1M14.9 14.9L16.7 17l-1.8 2.1M12.9 14.5l-1.8 5"/></svg>`
    },
    {
      name: "X",
      handle: "@airmiya",
      desc: "呼吸も この鼓動も 全部残してく",
      url: "https://x.com/airmiya",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5L5 19" stroke-linecap="round"/></svg>`
    },
    {
      name: "note",
      handle: "airmiya",
      desc: "noteでは少し整理して発信していきたいと思います。",
      url: "https://note.com/airmiya",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke-linecap="round"/></svg>`
    },
    {
      name: "Apps",
      handle: "推し発狂ジェネレーター",
      desc: "推しへの愛を叫ぼう",
      url: "https://airmiya7.github.io/xpostgen/",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 18l-2-2v-3l-3-1 3-1V8l2-2M16 18l2-2v-3l3-1-3-1V8l-2-2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 4l-4 16" stroke-linecap="round"/></svg>`
    },
    {
      name: "Apps",
      handle: "マイカ構文ジェネレーター",
      desc: "マイカ構文を生成しよう",
      url: "https://airmiya7.github.io/xpostgen/maika/",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 18l-2-2v-3l-3-1 3-1V8l2-2M16 18l2-2v-3l3-1-3-1V8l-2-2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 4l-4 16" stroke-linecap="round"/></svg>`
    }
  ];

  // プロフィールアイコン: Xのアイコンを unavatar 経由で取得。
  // 取得できなければ次の取得元を試し、最後は頭文字の表示にフォールバックする。
  (function(){
    const img = document.querySelector('.avatar img');
    const fb = document.querySelector('.avatar-fallback');
    const sources = [
      'https://unavatar.io/x/airmiya?fallback=false',
      'https://unavatar.io/twitter/airmiya?fallback=false'
    ];
    let i = 0;
    const next = () => {
      i += 1;
      if (i < sources.length){
        img.src = sources[i];
      } else {
        img.style.display = 'none';
        fb.style.display = 'flex';
      }
    };
    img.addEventListener('error', next);
    // スクリプト実行前にすでに失敗していた場合の取りこぼし対策
    if (img.complete && img.naturalWidth === 0) next();
  })();

  const grid = document.getElementById('linkGrid');

  links.forEach(link => {
    const a = document.createElement('a');
    a.className = 'card' + (link.wide ? ' wide' : '');
    a.href = link.url;
    if (link.sameTab !== true){
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
    a.innerHTML = `
      <div class="icon">${link.icon}</div>
      <div class="body">
        <div class="name">${link.name}</div>
        <div class="handle">${link.handle}</div>
        <div class="desc">${link.desc}</div>
      </div>
    `;
    grid.appendChild(a);
  });

  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
