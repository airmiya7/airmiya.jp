<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found | airmiya.jp</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F5EF;
    --ink: #1C1B19;
    --ink-soft: #5B584F;
    --navy: #1B2A56;
    --blue: #2454C7;
    --blue-soft: #4E7BE0;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-font-smoothing: antialiased; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image:
      radial-gradient(560px 420px at 8% -8%, rgba(36,84,199,0.16), transparent 65%),
      radial-gradient(620px 480px at 100% 8%, rgba(78,123,224,0.16), transparent 60%),
      radial-gradient(700px 520px at 50% 100%, rgba(36,84,199,0.10), transparent 65%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
  }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 24px;
    text-align: center;
  }

  .hero h1{
    display: inline-block;
    position: relative;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 38px);
    margin: 0 0 14px;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-shadow:
      0 1px 0 rgba(255,255,255,0.85),
      0 -1px 1px rgba(27,42,86,0.28);
  }

  .hero p{
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.9;
    margin: 0 0 32px;
  }

  .hero .en{
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: var(--navy-soft);
    letter-spacing: 0.04em;
  }

  .home-link{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 28px;
    background: linear-gradient(135deg, #EAF1FF 0%, var(--blue) 80%);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 14px 30px -14px rgba(36,84,199,0.55);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .home-link:hover,
  .home-link:focus-visible{
    transform: translateY(-3px);
    box-shadow: 0 20px 40px -16px rgba(36,84,199,0.6);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>404</h1>
    <p class="en">Page not found</p>
  </div>
  <a class="home-link" href="/">トップページへ戻る</a>
</div>

</body>
</html>
